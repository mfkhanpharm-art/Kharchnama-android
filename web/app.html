<title>Kharchnama</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first private-banking style — sticky header, quiet white cards on cool grey, navy hero, fixed tab bar, floating adviser figure. Single light theme by design. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#EEF0F4; --ink:#0E1726; --ink-2:#344054; --muted:#667085; --line:#E3E6EC;
  --navy:#0E1B2E; --navy-2:#173554; --accent:#0F7B5F; --accent-2:#22A57E; --accent-soft:#E2F3EC; --gold:#C9A227;
  --good:#12805C; --warn:#B76E00; --bad:#C23B4E; --inc:#2B5DA8;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;font-feature-settings:"tnum" 1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(243,244,247,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.1;letter-spacing:-.01em}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--navy);color:#fff}
.logo .i{width:19px;height:19px;color:#5FD3A8}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.02em}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{border:0;background:transparent;color:var(--ink-2);width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.monthnav button:hover{background:var(--surface-2)}
.monthnav .i{width:16px;height:16px}
.monthnav span{font-weight:700;font-size:13px;min-width:78px;text-align:center}
main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px;padding-block:6px 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0;letter-spacing:-.01em;text-wrap:balance;display:flex;align-items:center;gap:9px}
.chip-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.chip-ic .i{width:17px;height:17px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.banner{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:13.5px;color:#0B4F3D}
.banner b{display:block;font-weight:800}
.banner button{margin-left:auto;flex:none;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)}
.kinds{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border-radius:12px;padding:3px}
.kinds button{border:0;background:transparent;padding:7px 0;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.kinds button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(14,23,38,.12)}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;border:0;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:linear-gradient(140deg,var(--navy) 0%,var(--navy-2) 100%)}
.hero::after{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(34,165,126,.45),transparent 65%)}
.hero > *{position:relative;z-index:1}
.hero .eyebrow{color:rgba(255,255,255,.65)}
.hero .big{font-family:var(--f-display);font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:6px;word-break:break-all}
.hero .sub{font-size:12.5px;font-weight:600;margin-top:10px;color:rgba(255,255,255,.8);display:flex;gap:8px;flex-wrap:wrap}
.hero .sub span{background:rgba(255,255,255,.1);padding:3px 9px;border-radius:999px}
.ring{width:96px;height:96px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:6px}
.tile .chip-ic{width:28px;height:28px}
.tile .v{font-family:var(--f-display);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v.inc{color:var(--inc)} .v.net{color:var(--good)} .v.neg{color:var(--bad)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10px;font-weight:600}
.catrow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catname{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}
.catname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.ico .i{width:18px;height:18px}
.ico.lg{width:42px;height:42px;border-radius:12px}
.ico.lg .i{width:20px;height:20px}
.sw{width:9px;height:9px;border-radius:3px;flex:none}
.bar{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.bar i.over{background:var(--bad)}
.amt{font-family:var(--f-display);font-weight:600;font-size:14.5px;white-space:nowrap}
.pct{color:var(--muted);font-size:12px;font-weight:700;margin-left:6px;font-family:var(--f-body)}

/* list */
.daygrp{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dayhead{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);padding:14px 4px 6px;letter-spacing:.02em}
.tx{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:11px 12px;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;width:100%;color:inherit}
.tx:first-child{border-top:0}
.tx:hover{background:#FAFBFC}
.tx .t1{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t2{font-size:12.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt.inc{color:var(--good)}
.tx > div{min-width:0}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#FFF4D6;color:#8A6200;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.rec{display:inline-block;vertical-align:-3px;margin-left:4px;color:var(--muted)}
.rec .i{width:14px;height:14px}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .i{width:28px;height:28px;color:#98A2B3}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=password],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;font-weight:600}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(15,123,95,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:1px 1px 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.chip .i{width:15px;height:15px}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* insights */
.ins{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.ins:last-child{border-bottom:0}
.ins .ico{--c:#667085}
.ins.good .ico{--c:var(--good)} .ins.warn .ico{--c:var(--warn)} .ins.bad .ico{--c:var(--bad)} .ins.info .ico{--c:var(--inc)}
.ins b{display:block;font-weight:800}
.ins p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:700}
.legend span{display:flex;align-items:center;gap:5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn .i{width:17px;height:17px}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pill{padding:5px 11px;font-size:12.5px;border-radius:999px;color:var(--ink-2)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.budrow{display:grid;grid-template-columns:1fr 118px;gap:10px;align-items:center;padding:7px 0}
.budrow input{padding:8px 10px;font-size:15px;text-align:right}
pre.csv{white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--surface-2);border-radius:12px;padding:12px;max-height:220px;overflow:auto;margin:0}

/* wallets, bills, donut, goals, more */
.scroller{display:flex;gap:10px;overflow-x:auto;padding:2px 1px 4px;scrollbar-width:none;scroll-snap-type:x mandatory}
.scroller::-webkit-scrollbar{display:none}
.acc{flex:none;width:148px;border-radius:14px;padding:12px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--surface-2);text-align:left;color:var(--ink)}
.acc .n{font-weight:700;font-size:12.5px;color:var(--muted)}
.acc .b{font-family:var(--f-display);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc.add{background:transparent;border-style:dashed;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:13px}
.upc{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.upc:last-child{border-bottom:0}
.upc .t1{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upc > div{min-width:0}
.when{font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px;display:inline-block}
.when.over{background:#FDECEE;color:var(--bad)} .when.today{background:#FFF4D6;color:#8A6200} .when.soon{background:#EAF0FA;color:var(--inc)} .when.auto{background:var(--accent-soft);color:var(--good)}
.paybtn{border:0;border-radius:10px;padding:7px 12px;font-weight:800;font-size:12.5px;background:var(--accent);color:#fff}
.donutwrap{display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:center;margin:10px 0 4px}
.donut{width:128px;height:128px}
.dleg{display:flex;flex-direction:column;gap:7px;min-width:0}
.dleg div{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;min-width:0}
.dleg span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.goal{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .t1{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.goal .bar{height:7px;margin-top:6px}
.goal .bar i{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.goal > div{min-width:0}
.moregrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mtile{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--ink);min-width:0}
.mtile b{font-family:var(--f-display);font-weight:600;font-size:14.5px}
.mtile small{color:var(--muted);font-weight:600;font-size:12.5px;line-height:1.3}
.ops{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ops button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--ink-2)}
.calcprev{color:var(--muted);font-weight:700;font-size:13px;min-height:18px;padding-left:2px;display:flex;align-items:center;gap:6px}
.calcprev .i{width:15px;height:15px}
.favs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.favs::-webkit-scrollbar{display:none}
.fav{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 10px;font-weight:700;font-size:12.5px;display:flex;gap:7px;align-items:center}
.fav .i{width:15px;height:15px;color:var(--c)}
.fav small{color:var(--muted);font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:700}
.sw2{position:relative;width:44px;height:26px;border-radius:99px;background:#D0D5DD;border:0;flex:none;transition:background .15s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.sw2[aria-checked=true]{background:var(--accent)}
.sw2[aria-checked=true]::after{left:21px}
.cnt{display:grid;grid-template-columns:72px 1fr 112px;gap:8px;align-items:center;padding:5px 0}
.note{font-family:var(--f-display);font-weight:600;border-radius:8px;padding:6px 0;text-align:center;color:#fff;font-size:13.5px}
.cnt input{text-align:center;padding:8px}
.cnt .amt{text-align:right}
.cntotal{position:sticky;bottom:0;background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.cntotal .num{font-family:var(--f-display);font-size:22px}
.pill2{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;color:var(--ink-2)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr}
nav.tabs button{border:0;background:transparent;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#98A2B3}
nav.tabs button .i{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--ink)}
nav.tabs button[aria-current=page]::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:1px}
.fab{position:relative;top:-16px;justify-self:center;width:56px;height:56px;border-radius:18px;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px rgba(14,27,46,.35)}
.fab .i{width:24px;height:24px;stroke-width:2.2}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(14,23,38,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;max-height:92%;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(36px);opacity:.6}to{transform:none;opacity:1}}
.sheet .wrap{display:flex;flex-direction:column;gap:14px;padding-block:10px 4px}
.grab{width:40px;height:4px;border-radius:4px;background:#D0D5DD;margin:9px auto 0}
.amtin{display:flex;align-items:baseline;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.amtin span{color:var(--muted);font-size:18px;font-weight:700}
.amtin input{border:0!important;box-shadow:none!important;background:transparent;font-family:var(--f-display);font-weight:600;font-size:32px;padding:0;width:100%;outline:none}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
.catgrid button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 4px;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;line-height:1.15;color:var(--ink-2)}
.catgrid button[aria-pressed=true]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 6%,#fff);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:70;max-width:calc(100% - 32px);box-shadow:0 8px 20px rgba(14,23,38,.25)}

/* lock */
.lock{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lock .logo{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.1)}
.lock h2{font-size:20px;color:#fff}
.pins{display:flex;gap:14px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.pins i.on{background:#5FD3A8;border-color:#5FD3A8}
.pins.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,70px);gap:14px}
.keypad button{height:70px;border-radius:50%;border:0;background:rgba(255,255,255,.08);font-family:var(--f-display);font-size:24px;font-weight:500;color:#fff}
.keypad button.ghost{background:transparent;font-size:13px;font-family:var(--f-body);font-weight:700;color:rgba(255,255,255,.7)}
.lock .status{color:rgba(255,255,255,.7)}

/* tables */
table.rep{width:100%;border-collapse:collapse;font-size:13.5px}

/* ===== adviser ===== */
#adv{position:fixed;z-index:35;width:70px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 10px 12px rgba(14,23,38,.22));left:0;top:0}

/* ================= helpers ================= */
function pad(n){return String(n).padStart(2,"0")}
function ym(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function ymd(d){return ym(d)+"-"+pad(d.getDate())}
function parseD(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c||1)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function daysInM(y,m){return new Date(y,m+1,0).getDate()}
function today(){return ymd(new Date())}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function fmt(n){const v=Math.round(Math.abs(n));return(n<0?"−":"")+cur()+" "+v.toLocaleString("en-US")}
function short(n){const a=Math.abs(n);if(a>=1e6)return(n/1e6).toFixed(a>=1e7?0:1)+"M";if(a>=1e3)return(n/1e3).toFixed(a>=1e4?0:1)+"k";return String(Math.round(n))}
function uidGen(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function pctChange(a,b){if(!b)return null;return(a-b)/b*100}

function dayDiff(a,b){return Math.round((parseD(b)-parseD(a))/864e5)}
function niceDate(s){const d=parseD(s);return DOW[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()]}

/* ================= periods ================= */
function weekStart(d){const w=(d.getDay()-(S.settings.weekStart??1)+7)%7;return addDays(d,-w)}
function range(kind,anchor){
  const a=parseD(anchor);let s,e,label;
  if(kind==="day"){s=e=a;label=a.getDate()+" "+MON[a.getMonth()]+(a.getFullYear()!==new Date().getFullYear()?" "+a.getFullYear():"")}
  else if(kind==="week"){s=weekStart(a);e=addDays(s,6);label=s.getDate()+" "+MON[s.getMonth()]+"–"+e.getDate()+" "+MON[e.getMonth()]}
  else if(kind==="year"){s=new Date(a.getFullYear(),0,1);e=new Date(a.getFullYear(),11,31);label=String(a.getFullYear())}
  else{s=new Date(a.getFullYear(),a.getMonth(),1);e=new Date(a.getFullYear(),a.getMonth()+1,0);label=MON[a.getMonth()]+" "+a.getFullYear()}
  const r={kind,s:ymd(s),e:ymd(e),label,days:dayDiff(ymd(s),ymd(e))+1};
  const t=today();r.current=t>=r.s&&t<=r.e;r.elapsed=r.current?dayDiff(r.s,t)+1:(t>r.e?r.days:0);return r}
function shift(kind,anchor,n){const a=parseD(anchor);
  if(kind==="day")return ymd(addDays(a,n));if(kind==="week")return ymd(addDays(a,7*n));
  if(kind==="year")return ymd(new Date(a.getFullYear()+n,0,1));return ymd(new Date(a.getFullYear(),a.getMonth()+n,1))}
function R(){return range(S.kind,S.anchor)}
function prevR(r){return range(r.kind,shift(r.kind,r.s,-1))}
function nounFor(k){return k}
function budgetFactor(r){if(r.kind==="month")return 1;if(r.kind==="year")return 12;return r.days*12/365.25}

  const out=[];const now=new Date();let seed=11;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  for(let k=5;k>=0;k--){
    const base=new Date(now.getFullYear(),now.getMonth()-k,1);const m=ym(base);const last=k===0?now.getDate():daysInM(base.getFullYear(),base.getMonth());
    const add=(d,type,cat,amt,note,acct)=>{if(d>last)return;out.push({id:"s"+out.length,type,cat,amt:Math.round(amt),date:m+"-"+pad(d),note,acct,sample:true,ts:d})};
    add(1,"inc","salary",185000,"Monthly salary","bank");add(2,"exp","rent",55000,"House rent","bank");
    add(5,"exp","bills",8200+rnd()*3000,"Electricity bill","wallet");add(6,"exp","bills",2400,"Internet","wallet");
    add(10,"exp","edu",12000,"School fee","bank");add(15,"exp","family",10000,"Sent to parents","bank");

  return Object.entries(set.catBudgets||{}).filter(([,v])=>+v>0).map(([id,v])=>{const lim=v*f,s=spent[id]||0;return{id,lim,s,pct:s/lim,st:s>lim?"over":s>lim*.85?"near":"ok"}}).sort((a,b)=>b.pct-a.pct)}
function topNotes(list,n){const m={};list.forEach(t=>{const k=(t.note||"").trim();if(!k)return;const key=k.toLowerCase();(m[key]=m[key]||{n:k,c:0,v:0}).c++;m[key].v+=t.amt});return Object.values(m).sort((a,b)=>b.v-a.v).slice(0,n||4)}
function savingOps(r){const ops=[];const seen=new Set();const add=o=>{if(!(o.amt>=300))return;o.amt=Math.round(o.amt/100)*100;if(o.cat&&seen.has(o.cat))return;if(o.cat)seen.add(o.cat);ops.push(o)};
  budgetCheck(r).filter(x=>x.st==="over").forEach(x=>{const c=catInfo(x.id);add({cat:x.id,ic:c.icon,col:c.color,t:"Bring "+c.name+" back to its limit",d:"Spent "+fmt(x.s)+" against a "+fmt(x.lim)+" limit.",amt:x.s-x.lim})});
  const h4=histMonths(4);if(h4.length>=2){const last=h4[0],prev=h4.slice(1);Object.entries(last.cats).forEach(([id,v])=>{const av=prev.reduce((a,m)=>a+(m.cats[id]||0),0)/prev.length;if(av>0&&v>av*1.2&&v-av>1500){const c=catInfo(id);add({cat:id,ic:c.icon,col:c.color,t:c.name+" is above your usual",d:fmt(v)+" in "+last.r.label+" against about "+fmt(av)+" before.",amt:v-av})}})}
  let h=histMonths(3);if(!h.length){const s=stats(r);h=[{s,cats:Object.fromEntries(byCat(s.exp))}]}
  const avgE=h.reduce((a,m)=>a+m.s.e,0)/h.length;const grp=g=>allCats().filter(c=>tipGroup(c[0])===g).reduce((a,c)=>a+avgCat(h,c[0]),0);
  if(avgE>0){
    const eat=grp("food");if(eat>avgE*.08)add({cat:"food",ic:"utensils",col:"#C9612F",t:"Eat out a little less",d:"Dining and delivery average "+fmt(eat)+" a month. Two more home-cooked days a week cuts about a quarter.",amt:eat*.25});
    const sm=h.reduce((a,m)=>a+m.s.exp.filter(t=>t.amt<1000).length,0)/h.length,smT=h.reduce((a,m)=>a+sum(m.s.exp.filter(t=>t.amt<1000)),0)/h.length;if(sm>=15)add({ic:"coins",col:"#B5851B",t:"Watch the small spends",d:Math.round(sm)+" purchases under "+fmt(1000)+" a month add up to "+fmt(smT)+".",amt:smT*.3});
    const shop=grp("shop");if(shop>avgE*.06)add({cat:"shop",ic:"bag",col:"#B8466A",t:"Use a 24-hour rule for shopping",d:"Shopping averages "+fmt(shop)+" a month. Waiting a day before non-essential buys trims about a quarter.",amt:shop*.25});
    const fun=grp("fun")+grp("subs");if(fun>avgE*.03)add({cat:"fun",ic:"play",col:"#B5851B",t:"Review subscriptions and outings",d:"Entertainment and subscriptions average "+fmt(fun)+" a month. Cancel what you don't use.",amt:fun*.3});
    const tr=grp("trans");if(tr>avgE*.08)add({cat:"trans",ic:"fuel",col:"#2F6FB0",t:"Combine trips and carpool",d:"Transport averages "+fmt(tr)+" a month. Planning errands and carpooling saves about 15%.",amt:tr*.15});
    const pw=grp("bills")+grp("power");if(pw>avgE*.06)add({cat:"bills",ic:"zap",col:"#7A55B5",t:"Lower your utility bills",d:"Bills average "+fmt(pw)+" a month. Off-peak use and staying under tariff slabs can save around 10%.",amt:pw*.1});
  }
  return ops.sort((a,b)=>b.amt-a.amt).slice(0,6)}
function fgSnap(){const r=R();const st=stats(r);let h=histMonths(3);const fromCur=!h.length;if(fromCur)h=[{r,s:st,cats:Object.fromEntries(byCat(st.exp))}];
  const avgE=h.reduce((a,m)=>a+m.s.e,0)/h.length,avgI=h.reduce((a,m)=>a+m.s.i,0)/h.length;let ess=allCats().filter(c=>isEss(c[0])).reduce((a,c)=>a+avgCat(h,c[0]),0);if(!ess)ess=avgE*.6;
  const set=view();const goals=set.goals||[];const ef=goals.find(g=>/emergenc|rainy|safety/i.test(g.name));return{r,st,h,fromCur,avgE,avgI,ess,surplus:avgI-avgE,rate:avgI?(avgI-avgE)/avgI:null,set,goals,ef}}
function faygulTips(r){const m=fgSnap();const tips=[];
  if(m.rate!==null){if(m.rate<0)tips.push(["octagon","Spending is above income","On average you spend "+fmt(-m.surplus)+" a month more than you earn. Let's close the two biggest leaks first.","Where can I save?"]);
    else if(m.rate<.2)tips.push(["trend","Lift your savings to 20%","You keep about "+Math.round(m.rate*100)+"% ("+fmt(m.surplus)+" a month). Another "+fmt(m.avgI*.2-m.surplus)+" a month gets you to 20%.","How can I save more?"]);
    else tips.push(["check","Healthy savings rate","You keep about "+Math.round(m.rate*100)+"% of income. Let's put the surplus to work.","Where should I invest my savings?"])}
  else tips.push(["briefcase","Add your income","Record your salary or upload a slip so I can judge your savings rate.","What can you do?"]);
  const have=m.ef?+m.ef.saved||0:0,need=m.ess*3;if(have<need)tips.push(["umbrella",m.ef?"Grow your emergency fund":"Start an emergency fund",(m.ef?"You have "+fmt(have)+"; ":"Aim for ")+fmt(need)+" covers 3 months of essentials.","Help me build an emergency fund"]);
  const ops=savingOps(r);if(ops[0])tips.push([ops[0].ic,ops[0].t,ops[0].d,ops[0].cat?"How can I save on "+catInfo(ops[0].cat).name.toLowerCase()+"?":"Where can I save?"]);
  if(!catBudgetSum(S.settings)&&!isSample())tips.push(["target","Set category budgets","I can draft budgets from your last three months in one tap.","Plan my budget"]);
  else if(m.surplus>0&&m.rate>=.1)tips.push(["coins","Invest about "+fmt(m.surplus*.5)+" a month","Keep half your surplus liquid and invest the rest by goal timeline.","Where should I invest my savings?"]);
  return tips.slice(0,4)}
function insights(r){const c=stats(r);const out=[];const noun=r.kind;const set=view();
  if(!c.exp.length){out.push(["info","No spending recorded for "+r.label,"Tap + to add an entry, or switch to a different "+noun+"."]);return out}
  const ct=cmpTotals(r);if(ct.ch!==null)out.push([ct.ch>10?"bad":ct.ch<-5?"good":"info","Spending "+(ct.ch>=0?"up ":"down ")+Math.abs(ct.ch).toFixed(0)+"% vs "+ct.label,fmt(ct.now)+" against "+fmt(ct.prev)+"."]);
  const bu=budgetUse(r),B=bu.B;if(B&&r.kind!=="day"){const u=bu.spent/B;out.push([u>1?"bad":u>.85?"warn":"good",u>1?"Budget crossed by "+fmt(bu.spent-B):Math.round(u*100)+"% of budget used",fmt(bu.spent)+" of "+fmt(B)+(bu.outside>0?" (plus "+fmt(bu.outside)+" outside budgets)":"")+(r.current?" with "+Math.round(r.elapsed/r.days*100)+"% of the "+noun+" gone.":".")])}
  budgetCheck(r).forEach(x=>{if(x.st==="over")out.push(["bad",catInfo(x.id).name+" over budget","Spent "+fmt(x.s)+" against "+fmt(x.lim)+"."]);else if(x.st==="near")out.push(["warn",catInfo(x.id).name+" close to its limit",fmt(x.lim-x.s)+" left of "+fmt(x.lim)+"."])});
  const cats=byCat(c.exp);if(cats[0])out.push(["info",catInfo(cats[0][0]).name+" leads your spending",Math.round(cats[0][1]/c.e*100)+"% of the total ("+fmt(cats[0][1])+")."]);
  const up=catCompare(r).filter(x=>x.prev>0&&x.now-x.prev>500).sort((a,b)=>(b.now-b.prev)-(a.now-a.prev))[0];if(up)out.push(["warn",catInfo(up.id).name+" rose the most",fmt(up.now)+" vs "+fmt(up.prev)+", "+ct.label+"."]);
  const big=c.exp.slice().sort((a,b)=>b.amt-a.amt)[0];out.push(["info","Largest single expense: "+fmt(big.amt),(big.note||catInfo(big.cat).name)+" on "+niceDate(big.date)+"."]);
  if(c.i>0){const rate=(c.i-c.e)/c.i*100;out.push([rate>=20?"good":rate>=0?"warn":"bad","Savings rate "+rate.toFixed(0)+"%",rate>=0?"You kept "+fmt(c.i-c.e)+" of "+fmt(c.i)+" income.":"You spent "+fmt(c.e-c.i)+" more than you earned."])}
  return out}
function summaryText(r){const st=stats(r);let s="Kharchnama summary: "+r.label+"\nIncome: "+fmt(st.i)+"\nSpent: "+fmt(st.e)+"\nSaved: "+fmt(st.i-st.e)+"\n\nTop categories:\n";
  byCat(st.exp).slice(0,5).forEach(([id,v])=>{s+="- "+catInfo(id).name+": "+fmt(v)+" ("+Math.round(v/Math.max(1,st.e)*100)+"%)\n"});
  s+="\nInsights:\n";insights(r).forEach(x=>{s+="- "+x[1]+". "+x[2]+"\n"});return s}

function parseCSV(text){const rows=[];let row=[],f="",q=false;for(let i=0;i<text.length;i++){const c=text[i];

  if(f.type==="application/pdf"||name.endsWith(".pdf")){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js");await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js");
    const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

  const tn=topNotes(list,4);if(tn.length)b+='<div class="card">'+h2("tag","Most spent on")+tn.map(n=>'<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700">'+esc(n.n)+' <span class="status" style="display:inline">'+n.c+'×</span></span><b class="num">'+fmt(n.v)+'</b></div>').join("")+'</div>';

  b+='<div>'+h2("list","Entries day by day")+(list.length?groupDays(list):emptyH("list","No entries in "+r.label+"."))+'</div>';
  return sheet(c.icon,c.name,b)}

/* ================= Faygul: on-device financial intelligence =================
   Works without any network or AI service. Combines the user's Kharchnama data
   with a built-in finance knowledge base focused on Pakistan. */
const FKB=[
 {k:["emergency fund","emergency","rainy day","safety net"],t:"Emergency fund",a:`An emergency fund is money kept only for real shocks: job loss, a medical bill, an urgent repair.
- Aim for **3 months of essential expenses** if your income is steady, and **6 months** if you're self-employed, the only earner, or support parents.
- Keep it safe and quick to withdraw: a separate savings account or a money market fund. Not stocks, plots or a committee.
- Build it before investing, and refill it after you use it.`},
 {k:["50/30/20","50 30 20","budget method","budgeting","zero based","zero-based","envelope"],t:"Budgeting methods",a:`Three methods that work well:
- **50/30/20**: 50% of take-home pay on needs (rent, bills, groceries, transport, fees), 30% on wants, 20% on savings and debt payoff.
- **Zero-based**: give every rupee a job at the start of the month until income minus plans equals zero.
- **Envelope**: a fixed cash limit per category; when the envelope is empty, that spending stops.
In big cities needs often exceed 50%. If so, protect the 20% savings first and squeeze wants.`},
 {k:["pay yourself first","automate","salary day","save first","standing order"],t:"Pay yourself first",a:`Move your savings out on salary day, before spending starts. A standing order from your salary account to a separate savings account or fund makes it automatic. Start with 10% and add 2% with every increment.`},
 {k:["debt","loan","pay off","avalanche","snowball","borrow","qarz"],t:"Paying off debt",a:`List every debt with its balance, profit rate and minimum payment.
- **Avalanche**: pay minimums on all, and put every extra rupee on the highest-rate debt first. Saves the most money.
- **Snowball**: clear the smallest balance first for quick wins, then roll that payment into the next.
Keep total installments under **20% of take-home pay**, avoid new borrowing while paying off, and never borrow to invest.`},
 {k:["credit card","card bill","minimum payment","cash advance"],t:"Credit cards",a:`Pay the **full statement balance** by the due date every month. Paying only the minimum triggers very high mark-up plus taxes and fees. Avoid cash withdrawals on a credit card, since mark-up starts immediately. Keep usage under about 30% of your limit and set up auto-pay from your account.`},
 {k:["installment","instalment","bnpl","easy monthly","0%","zero percent"],t:"Installment plans",a:`"0% installments" often hide processing fees, a higher sticker price or bundled insurance. Compare the total you'll pay with the cash price. Use installments only for needs, keep all installments under 20% of take-home pay, and don't stack several plans at once.`},
 {k:["committee","bc","beesi","rosca","kameti"],t:"Committees (BC)",a:`A committee is a rotating savings circle: everyone pays a fixed amount monthly and one member takes the pot each round. It builds discipline but pays **no profit**, so inflation erodes it, and it depends entirely on trust. Join only with people you know well and keep written records. For pure saving, a money market fund usually does better.`},
 {k:["national savings","nss","behbood","savings certificate","regular income","defence saving","dsc","ric","sarwa","pensioners benefit"],t:"National Savings (NSS)",a:`National Savings schemes are backed by the government:
- **Regular Income Certificates**: monthly profit, good for steady income.
- **Defence Savings Certificates**: long term (10 years), profit compounds.
- **Behbood Savings Certificates** and **Pensioners' Benefit Account**: higher monthly profit, only for senior citizens, widows, pensioners and certain others.
- **Sarwa Islamic** accounts and certificates for Shariah-compliant savers.
Profit rates are revised often in line with interest rates, and non-filers pay higher withholding tax on profit. Check current rates at savings.gov.pk or any National Savings centre.`},
 {k:["savings account","bank account","term deposit","tdr","fixed deposit","profit rate","bank profit"],t:"Bank savings and term deposits",a:`Savings accounts give easy access with modest profit. Term deposits (TDRs) pay more if you lock money for 3 months to 5 years. Profit generally moves with the State Bank's policy rate. Compare the rate after tax, whether profit is paid monthly or at maturity, and whether early withdrawal cuts the profit. Islamic banks pay profit through profit-sharing pools.`},
 {k:["mutual fund","money market","income fund","equity fund","islamic fund","amc","mufap","fund"],t:"Mutual funds",a:`Mutual funds pool money and are run by SECP-regulated asset management companies:
- **Money market funds**: lowest risk, withdraw in 1–2 working days. Good for emergency money and short goals.
- **Income funds**: a little more return and risk, for 1–3 years.
- **Equity funds**: invest in shares, can rise or fall sharply, for 5+ years.
Shariah-compliant versions exist for each. Compare past returns and charges on the MUFAP website, check entry and exit loads, and remember returns are never guaranteed.`},
 {k:["pension","vps","voluntary pension","retirement fund"],t:"Voluntary Pension Schemes",a:`A VPS builds a retirement fund with an asset management company. You choose a mix of equity, debt and money market sub-funds and shift to safer ones as you age. Contributions to approved pension funds can earn an income tax credit within limits set by tax law. The money is meant to stay until retirement; early withdrawal can be taxed. Ask the fund manager for current rules and charges.`},
 {k:["stock","stocks","shares","psx","stock market","equity","kse"],t:"Investing in shares",a:`Owning shares on the Pakistan Stock Exchange means owning part of companies. Prices can swing 20–30% in a year, so invest only money you won't need for **5+ years**. For most people an equity mutual fund is easier than picking stocks. If you invest directly, use a PSX-licensed broker with a CDC account, spread across sectors, ignore tips, avoid borrowing to invest, and invest gradually.`},
 {k:["gold","sona","tola","jewellery","jewelry"],t:"Gold",a:`Gold protects against rupee depreciation over long periods but pays no income and can fall for years. 1 tola is about **11.66 grams**. Jewellery carries making charges you lose when selling; bars or coins from reputable dealers keep more value. A sensible share is **5–15% of long-term savings**, not your emergency fund. Gold above the nisab is subject to zakat.`},
 {k:["plot","property","real estate","house investment","file","society","land"],t:"Property",a:`Property can build wealth but is illiquid, needs large sums and carries legal risk. Verify the society's approval with the development authority, check the title and transfer history, avoid "files" in unlaunched projects, and count every cost: taxes on purchase and sale, transfer fees and commission. Don't use emergency money or money you need within 5 years.`},
 {k:["roshan digital","rda","overseas","naya pakistan","remittance"],t:"Roshan Digital Account",a:`Roshan Digital Accounts let non-resident Pakistanis open a Pakistani bank account online and invest in Naya Pakistan Certificates, shares, mutual funds and property. If family abroad sends you money, using banks or approved channels is safer and keeps the inflow documented.`},
 {k:["inflation","mehngai","real return","purchasing power"],t:"Inflation",a:`Inflation shrinks what your money can buy. Your **real return = profit rate − inflation**. Cash sitting in a current account or a committee loses value every year. Goals priced today (Hajj, school fees, a car) will cost more later, so grow your targets with inflation.`},
 {k:["compound","compounding","rule of 72","double my money","grow money"],t:"Compounding",a:`Compounding means earning returns on past returns. **Rule of 72**: divide 72 by the yearly return to see roughly how many years it takes to double (12% a year ≈ 6 years). Starting 5 years earlier often matters more than investing a larger amount later.`},
 {k:["tax","filer","non filer","non-filer","fbr","iris","atl","active taxpayer","withholding","tax return"],t:"Income tax basics",a:`Salaried income tax is deducted by your employer each month, but you still file an annual return on FBR's IRIS portal (usually due by 30 September).
- Being on the **Active Taxpayer List** cuts withholding tax on bank profit, dividends, property and vehicle purchases.
- Keep salary slips and tax certificates.
- Zakat paid and contributions to approved pension funds can reduce tax within limits.
Tax slabs change in every budget, so check FBR's current schedule or ask a tax adviser.`},
 {k:["zakat","nisab","zakaat"],t:"Zakat",a:`Zakat is **2.5%** of zakatable wealth (cash, bank balances, gold, silver, trade goods, investments) held for a full lunar year above the **nisab**.
- Nisab is the value of **52.5 tola (612.36 g) of silver** or **7.5 tola (87.48 g) of gold**; many scholars use the silver value since it's lower.
- Your home, car and household items are exempt.
- Banks deduct zakat from savings accounts on 1st Ramadan unless you submit a CZ-50 declaration.
- Zakat paid is deductible from taxable income.
For your own case, confirm with a scholar you trust.`},
 {k:["insurance","takaful","life cover","health insurance","health cover"],t:"Insurance and takaful",a:`Protect before you invest:
- **Health cover** first, through your employer or a takaful plan; one hospital stay can wipe out savings.
- **Term life cover** if anyone depends on your income; it's affordable and pays only on death.
Be careful with savings-linked policies: early-year charges are high, and surrendering early returns much less than you paid.`},
 {k:["provident fund","gratuity","eobi","pf"],t:"Provident fund, gratuity and EOBI",a:`Your **provident fund** grows from your and your employer's monthly contributions plus profit, and is usually paid when you leave or retire. **Gratuity** is a lump sum based on years of service. **EOBI** pays a small old-age pension if contributions were made long enough. Ask HR for your yearly PF statement and check that EOBI contributions are deposited.`},
 {k:["retire","retirement","old age","pension planning"],t:"Retirement planning",a:`A rough target is **20–25 times your yearly expenses** by retirement. Start early, combine provident fund, VPS and long-term equity funds, and shift to safer funds in the last 5–10 years. Keep a separate emergency fund so you never dip into retirement money.`},
 {k:["buy a car","car loan","auto finance","leasing","new car","vehicle"],t:"Buying a car",a:`Count the **total cost of ownership**: price, registration and taxes, insurance, fuel, maintenance and depreciation. Keep the car's monthly cost (installment plus running costs) under about **15–20% of take-home pay**. A bigger down payment and shorter tenure cut mark-up. Get any used car inspected.`},
 {k:["home loan","house loan","mortgage","buy house","housing finance","buy a house"],t:"Buying a home",a:`Housing finance usually needs **15–30% down payment** and a steady income record. Keep the installment under about **30–35% of household take-home pay**, and keep an emergency fund for at least 6 installments. Mark-up is often variable, so check you can still pay if rates rise. Government housing schemes change often; ask banks for current terms.`},
 {k:["child education","kids future","university fund","education plan"],t:"Planning for education",a:`Education costs usually rise faster than general inflation. Start a savings box per child early, invest money needed 5+ years away in a mix of income and equity funds, and move it to safer funds 2–3 years before it's needed.`},
 {k:["hajj","umrah"],t:"Saving for Hajj or Umrah",a:`Price the package and travel today, add 10–15% a year for inflation and exchange-rate changes, and divide by the months left. That's your monthly saving target. Keep the money in a money market fund or savings account, not shares, and track it in a savings box.`},
 {k:["wedding","shaadi","marriage","jahez","dowry"],t:"Planning a wedding",a:`Set a firm total ceiling first, then split it across venue, food, clothes, jewellery and gifts. Avoid borrowing for a wedding. Start a dedicated savings box early, and buy gold gradually if it's part of the plan. Trimming the guest list is usually the biggest single saving.`},
 {k:["increment","raise","salary increase","negotiate","promotion","appraisal"],t:"Getting a raise",a:`Prepare with numbers: results you delivered, revenue or savings you created, and market pay for your role. Ask for a specific figure; if cash is tight, negotiate benefits like medical, fuel or training. When your salary rises, save at least half of the increase before your lifestyle absorbs it.`},
 {k:["side income","freelanc","extra income","second income","business idea"],t:"Extra income",a:`Extra income speeds up every goal: freelancing in your professional skills, tutoring, consulting or a small online business. Keep it in its own wallet, set aside a share for tax, and register with FBR as earnings grow. IT and freelance export income may qualify for special tax treatment; check current rules with FBR or PSEB.`},
 {k:["electricity","bijli","units","light bill","solar","inverter ac","peak hours"],t:"Cutting electricity bills",a:`- Stay under your tariff's slab thresholds; crossing a slab can raise the rate on every unit.
- Run heavy appliances outside evening **peak hours**.
- Set ACs to 26°C, clean filters and prefer inverter models.
- Use LED lights and switch off standby devices.
- If you own the house, compare the payback of rooftop solar with net metering under current policy.`},
 {k:["fuel saving","petrol price","mileage","save fuel"],t:"Saving fuel",a:`Keep tyres at the right pressure, avoid hard acceleration, combine errands into one trip, carpool to work and service the car on time. Track fuel as its own heading to see the effect.`},
 {k:["grocery saving","bulk buying","ration","monthly grocery"],t:"Saving on groceries",a:`Plan meals for the week, buy staples (flour, rice, oil, pulses) monthly in bulk from wholesale or discount stores, shop with a list, and compare price per kg. Buy fruit and vegetables in season from the mandi, and don't shop hungry.`},
 {k:["scam","fraud","otp","pin","phishing","fake call","hack"],t:"Staying safe from fraud",a:`Banks never ask for your **OTP, PIN, CVV or full card number** by phone, SMS or WhatsApp. Don't open links in messages about prizes or blocked accounts; call the number on your card instead. Turn on transaction alerts, and if money leaves your account wrongly, tell your bank immediately and report it to the FIA cybercrime wing.`},
 {k:["net worth","wealth","assets","liabilities"],t:"Net worth",a:`Net worth = everything you own (savings, investments, gold, property at a fair value) − everything you owe. Checking it every 6 months shows real progress better than income alone. The aim is to grow it every year.`},
 {k:["financial goal","plan a goal","smart goal","set a goal"],t:"Setting goals",a:`Good goals are specific, priced and dated: "Rs 4.5 lakh for Umrah by December 2027". Divide the amount by the months left for a monthly target. Keep it by timeline: under 1 year in a savings account or money market fund; 1–3 years in income funds or term deposits; 5+ years add equity funds. Track it in a savings box.`},
 {k:["halal","shariah","islamic investment","riba","interest free","sukuk"],t:"Halal investing",a:`Shariah-compliant options include Islamic bank savings and term deposits (profit-sharing), Islamic money market, income and equity funds, Sukuk, Sarwa Islamic National Savings products, and Islamic VPS pension funds. Each should be certified by a Shariah board; check the approval in the fund documents.`},
 {k:["pocket money","kids money","teach kids","children money"],t:"Teaching children about money",a:`Give children a fixed weekly amount and let them manage it with three jars: spend, save and give. Matching what they save teaches compounding early.`},
 {k:["parents","family support","sending money home","support family"],t:"Supporting family",a:`Treat family support as a need: agree a fixed monthly amount and pay it on salary day so it never competes with impulse spending. Health cover for parents often costs less than a single hospital bill.`},
 {k:["impulse","overspend","control spending","discipline","stop spending"],t:"Controlling impulse spending",a:`- Wait 24 hours before buying anything non-essential over Rs 5,000.
- Unsubscribe from sale alerts and remove saved cards from shopping apps.
- Pay for wants from a fixed weekly allowance.
- Review your week every Sunday in Kharchnama; awareness alone cuts spending.`},
 {k:["invest","investment","investing","where to invest","surplus"],t:"Investing in the right order",a:`Invest in this order:
1. Emergency fund (3–6 months of essentials).
2. Clear expensive debt, especially credit cards.
3. Goals by timeline: under 1 year in money market funds or savings accounts; 1–3 years in income funds, term deposits or National Savings; 5+ years add equity funds or a VPS, with 5–10% in gold.
Diversify, and never put everything into one plot, stock or committee.`}

  if(b.dataset.panel)return openPanel(b.dataset.panel);
  if(b.dataset.ask)return openChat(b.dataset.ask);
  if(b.dataset.pay){const[rid,d]=b.dataset.pay.split("|");const rec=view().recurring.find(x=>x.id===rid);if(!rec)return;if(rec.sample){openPanel("entry",{preset:{type:rec.type,cat:rec.cat,amt:String(rec.amt),note:rec.note,acct:rec.acct,date:d}});return}
    await putTx({id:recTxId(rec,d),type:rec.type,cat:rec.cat,amt:rec.amt,date:d,note:rec.note,acct:rec.acct,to:rec.to||"",rec:rec.id,ts:Date.now()});toast("Paid: "+(rec.note||catInfo(rec.cat).name));return}
  if(b.dataset.type){S.typeFilter=b.dataset.type;S.filterCat="all";return render()}
  if(b.dataset.cat){S.filterCat=b.dataset.cat;return render()}
  if(b.dataset.acf){S.filterAcct=b.dataset.acf;return render()}
  await act(b.dataset.act,b)});
async function act(a,b){
  if(!a)return;const r=R();
  if(a==="transfer")return openPanel("entry",{preset:{type:"trf",acct:"bank",to:"cash",cat:"trf"}});
  if(a==="newrec")return openPanel("entry",{preset:{repeat:"monthly",auto:false,cat:"bills"}});
  if(a==="copysum"){const txt=summaryText(r);try{await navigator.clipboard.writeText(txt);toast("Summary copied")}catch(err){const box=document.getElementById("sumBox");box.innerHTML='<div class="status" style="margin:10px 0 6px">Copying isn\'t allowed here. Select the text below.</div><pre class="csv" tabindex="0">'+esc(txt)+'</pre>';const p=box.querySelector("pre");const rg=document.createRange();rg.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(rg)}return}
  if(a==="pdf")return exportPDF(r);
  if(a==="xlsx")return exportXLSX(inR(r),r.label);
  if(a==="xlsxall")return exportXLSX(S.txs,"all entries");
  if(a==="csv"){if(!S.txs.length)return toast("No entries to export yet.");const csv=toCSV();if(downloads&&await saveFile("kharchnama-"+today()+".csv",new Blob([csv],{type:"text/csv"})))return toast("CSV saved");
    const box=document.getElementById("csvBox");if(box)box.innerHTML='<div class="status" style="margin:10px 0 6px">Copy this text and save it as a .csv file.</div><pre class="csv" tabindex="0">'+esc(csv)+'</pre>';return}
  if(a==="backup"){const blob=new Blob([JSON.stringify({app:"kharcha",version:4,exported:new Date().toISOString(),settings:Object.assign({},S.settings,{pinHash:""}),txs:S.txs})],{type:"application/json"});if(await saveFile("kharchnama-backup-"+today()+".json",blob))toast("Backup saved");return}
  if(a==="restore"){fileMode="restore";const f=document.getElementById("fileIn");f.accept=".json,application/json";f.click();return}
  if(a==="import"){fileMode="csv";const f=document.getElementById("fileIn");f.accept=".csv,text/csv";f.click();return}
  if(a==="wipe"){if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Tap again to delete "+S.txs.length+" entries";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="Delete all entries"}},4000);return}
    const ids=S.txs.map(t=>t.id);S.txs=[];saveLocal();render();renderPanel();if(S.mode==="cloud"){for(const id of ids){try{await txCol.doc(id).delete()}catch(err){}}}toast("All entries deleted");return}
  if(a==="addcat"){const i=document.getElementById("newCat");const name=i.value.trim();if(!name)return;const k=(S.settings.customCats||[]).length;
    S.settings.customCats=(S.settings.customCats||[]).concat([{id:"c"+uidGen(),name,color:PAL[k%PAL.length],icon:document.getElementById("ncIc").value||"tag"}]);saveSettings();renderPanel();toast(name+" added");return}
}
document.getElementById("sheetHost").addEventListener("click",async e=>{
  const b=e.target.closest("button,[data-close]");if(!b)return;const p=S.panel;if(!p)return;
  if(b.hasAttribute("data-close")){closePanel();render();return}
  if(b.dataset.act)return act(b.dataset.act,b);
  const s=S.settings;
  if(p.kind==="entry"){const d=S.draft;
    if(b.dataset.ty){captureEntry();d.type=b.dataset.ty;if(d.type==="trf"&&d.acct===d.to)d.to=accts().find(a=>a.id!==d.acct).id;renderPanel();return}
    if(b.dataset.c){d.cat=b.dataset.c;document.querySelectorAll("#sheetHost [data-c]").forEach(x=>x.setAttribute("aria-pressed",x===b));return}
    if(b.dataset.fav!=null){const f=favorites()[+b.dataset.fav];captureEntry();Object.assign(d,{cat:f.cat,note:f.note,amt:String(f.amt),acct:f.acct});renderPanel();return}
    if(b.dataset.op){const i=document.getElementById("fAmt");const o=b.dataset.op;
      if(o==="⌫")i.value=i.value.slice(0,-1);else if(o==="="){const v=calc(i.value);if(!isNaN(v))i.value=String(v)}else{const m={"−":"-"}[o]||o;i.value=i.value.replace(/[+\-×÷*/]$/,"")+m}
      i.dispatchEvent(new Event("input",{bubbles:true}));return}
    if(b.hasAttribute("data-auto")){captureEntry();d.auto=!d.auto;renderPanel();return}
    if(b.hasAttribute("data-del")){if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Tap to confirm";return}await delTx(d.id);closePanel();toast("Entry deleted");return}
    if(b.hasAttribute("data-save"))return saveEntry(false);if(b.hasAttribute("data-save-more"))return saveEntry(true);return}
  if(b.dataset.gnew!=null){const n=document.getElementById("gName").value.trim(),t=parseFloat(document.getElementById("gTarget").value);if(!n||!(t>0))return toast("Give the goal a name and a target.");
    s.goals=(s.goals||[]).concat([{id:uidGen(),name:n,target:t,saved:0,icon:document.getElementById("gIc").value}]);saveSettings();renderPanel();render();toast("Goal created");return}
  if(b.dataset.gadd||b.dataset.gsub){const id=b.dataset.gadd||b.dataset.gsub;const g=s.goals.find(x=>x.id===id);const v=parseFloat(document.getElementById("ga_"+id).value);if(!g||!(v>0))return toast("Enter an amount first.");
    g.saved=Math.max(0,(+g.saved||0)+(b.dataset.gadd?v:-v));saveSettings();renderPanel();render();toast(g.saved>=g.target?"Goal reached":b.dataset.gadd?"Added to "+g.name:"Withdrawn");return}
  if(b.dataset.gdel){if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Sure?";return}s.goals=s.goals.filter(x=>x.id!==b.dataset.gdel);saveSettings();renderPanel();render();return}
  if(b.dataset.anew!=null){const n=document.getElementById("aName").value.trim();if(!n)return toast("Name the wallet first.");const k=s.accounts.length;s.accounts.push({id:"a"+uidGen(),name:n,icon:document.getElementById("aIc").value,opening:0,color:PAL[k%PAL.length]});saveSettings();renderPanel();render();toast("Wallet added");return}
  if(b.dataset.rauto){const r=s.recurring.find(x=>x.id===b.dataset.rauto);r.auto=!r.auto;saveSettings();renderPanel();if(r.auto){autoRan=false;afterLoad()}return}
  if(b.dataset.rdel){if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Stop?";return}s.recurring=s.recurring.filter(x=>x.id!==b.dataset.rdel);saveSettings();renderPanel();render();toast("Stopped repeating");return}
  if(b.dataset.cuse!=null){const t=NOTES_PKR.reduce((a,[d])=>a+(+COUNTS[d]||0)*d,0);if(!t)return toast("Count some notes first.");openPanel("entry",{preset:{amt:String(t),acct:"cash",note:"Cash count"}});return}
  if(b.dataset.creset!=null){COUNTS={};renderPanel();return}
  if(b.dataset.pinset!=null){const a=document.getElementById("pin1").value,c=document.getElementById("pin2").value;const er=document.getElementById("pinErr");if(!/^\d{4}$/.test(a))return er.textContent="Use exactly 4 digits.";if(a!==c)return er.textContent="The two PINs don't match.";
    s.pinHash=await sha(a);S.unlocked=true;saveSettings();renderPanel();renderMore();toast("App lock is on");return}
  if(b.dataset.pinoff!=null){s.pinHash="";saveSettings();renderPanel();renderMore();toast("App lock is off");return}
  if(b.dataset.ccdel){s.customCats=s.customCats.filter(x=>x.id!==b.dataset.ccdel);saveSettings();renderPanel();return}
});
document.getElementById("sheetHost").addEventListener("keydown",e=>{if(e.key==="Escape"){closePanel();render()}});
document.addEventListener("input",e=>{const el=e.target;const s=S.settings;
  if(el.id==="q"){S.query=el.value;clearTimeout(S._qt);S._qt=setTimeout(render,150)}
  if(el.id==="chatIn"){el.style.height="46px";el.style.height=Math.min(120,el.scrollHeight)+"px"}
  if(el.id==="fAmt"){const v=calc(el.value);const p=document.getElementById("calcPrev");if(p)p.innerHTML=/[+\-*/×÷−]/.test(el.value)&&!isNaN(v)?"= "+esc(fmt(v)):I("calc")+"Type sums like 450+120×2"}
  if(el.id==="bud"){s.budget=Math.max(0,parseFloat(el.value)||0);saveSettings()}
  if(el.id==="curr"){s.currency=el.value.trim()||"Rs";saveSettings()}
  if(el.dataset&&el.dataset.cb){s.catBudgets=Object.assign({},s.catBudgets);const v=parseFloat(el.value)||0;if(v)s.catBudgets[el.dataset.cb]=v;else delete s.catBudgets[el.dataset.cb];saveSettings()}
  if(el.dataset&&el.dataset.aname){const a=s.accounts.find(x=>x.id===el.dataset.aname);if(a){a.name=el.value||a.name;saveSettings()}}
  if(el.dataset&&el.dataset.aopen){const a=s.accounts.find(x=>x.id===el.dataset.aopen);if(a){a.opening=parseFloat(el.value)||0;saveSettings()}}
  if(el.dataset&&el.dataset.den){COUNTS[el.dataset.den]=el.value;const d=+el.dataset.den;document.getElementById("dl_"+d).textContent=fmt((+el.value||0)*d);document.getElementById("cTot").textContent=fmt(NOTES_PKR.reduce((a,[x])=>a+(+COUNTS[x]||0)*x,0))}
});
document.addEventListener("change",e=>{if(e.target.id==="wks"){S.settings.weekStart=+e.target.value;saveSettings();render()}if(e.target.id==="fRep"){captureEntry();renderPanel()}});
document.addEventListener("submit",e=>{if(e.target.id==="chatForm"){e.preventDefault();const t=document.getElementById("chatIn");sendChat(t.value);t.value="";t.style.height="46px"}});
document.getElementById("pPrev").onclick=()=>{S.anchor=shift(S.kind,R().s,-1);render()};
document.getElementById("pNext").onclick=()=>{S.anchor=shift(S.kind,R().s,1);render()};

/* ================= boot ================= */
document.getElementById("logoSlot").innerHTML=logoSVG();
document.getElementById("pPrev").innerHTML=I("left");document.getElementById("pNext").innerHTML=I("right");
document.getElementById("navIn").innerHTML='<button data-tab="home" aria-current="page">'+I("home")+'Home</button><button data-tab="list">'+I("list")+'Entries</button><button class="fab" id="fab" aria-label="Add entry">'+I("plus")+'</button><button data-tab="ins">'+I("bars")+'Insights</button><button data-tab="more">'+I("grid")+'More</button>';
loadLocal();
let t0="home";try{t0=localStorage.getItem("kharcha.tab")||"home"}catch(e){}
go(["home","list","ins","more"].includes(t0)?t0:"home");
drawAdv();
checkLock();
setTimeout(initCloud,0);
})();
</script>
