name: Build Kharchnama APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web app and copy into Android
        run: |
          node build-web.js
          npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on GitHub runners)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log; then
            grep -E "error:|FAILURE|What went wrong|Could not|e: |> " ../gradle.log | grep -v "^> Task" | head -40 > ../gradle-err.txt || true
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' ../gradle-err.txt)
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kharchnama-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kharchnama-APK
          path: Kharchnama-${{ github.run_number }}.apk

      - name: Publish download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kharchnama build ${{ github.run_number }}
          body: Open this page on your Android phone and tap the .apk file to install.
          files: Kharchnama-${{ github.run_number }}.apk
