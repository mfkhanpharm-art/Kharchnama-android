name: Build Kharcha APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web app and copy into Android
        run: |
          node build-web.js
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kharcha-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kharcha-APK
          path: Kharcha-${{ github.run_number }}.apk

      - name: Publish download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kharcha build ${{ github.run_number }}
          body: Open this page on your Android phone and tap the .apk file to install.
          files: Kharcha-${{ github.run_number }}.apk
